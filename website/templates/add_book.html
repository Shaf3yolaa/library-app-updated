{% extends "layout.html" %}{% block content %}<div class="form-card"><div class="eyebrow">New record</div><h1>Add a book</h1><p class="intro">Create a book entry with its cover, price, author, publisher, category and publication year.</p><form method="POST" enctype="multipart/form-data"><div class="field"><label>BOOK TITLE</label><input name="title" value="{{ form.title }}" placeholder="e.g. Palace Walk" required></div><div class="form-grid"><div class="field"><label>PRICE ($)</label><input type="number" step="0.01" min="0" name="price" value="{{ form.price }}" placeholder="29.99" required></div><div class="field"><label>PUBLISH YEAR</label><input type="number" min="1500" max="2100" name="publish_year" value="{{ form.publish_year }}" placeholder="1956" required></div></div><div class="field"><label>AUTHOR</label><select name="author_id" required><option value="" disabled {% if not form.author_id %}selected{% endif %}>Select an author</option>{% for a in authors %}<option value="{{ a.author_id }}" {% if form.author_id|string == a.author_id|string %}selected{% endif %}>{{ a.name }}</option>{% endfor %}</select></div><div class="form-grid"><div class="field"><label>PUBLISHER</label><select name="publisher_id" required><option value="" disabled {% if not form.publisher_id %}selected{% endif %}>Select a publisher</option>{% for p in publishers %}<option value="{{ p.publisher_id }}" {% if form.publisher_id|string == p.publisher_id|string %}selected{% endif %}>{{ p.name }}</option>{% endfor %}</select></div><div class="field"><label>CATEGORY</label><select name="category_id" required><option value="" disabled {% if not form.category_id %}selected{% endif %}>Select a category</option>{% for c in categories %}<option value="{{ c.category_id }}" {% if form.category_id|string == c.category_id|string %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></div></div><div class="field"><label>BOOK COVER</label><div class="file-box"><input type="file" name="image" accept="image/png,image/jpeg,image/webp,image/gif" onchange="previewImage(this,'bookPreview')"><img id="bookPreview" class="preview" src="{{ url_for('static',filename='background.jpeg') }}"></div></div><div class="form-actions"><button class="primary-btn flex-grow-1" type="submit">Save Book</button><a class="secondary-btn" href="{{ url_for('library') }}">Cancel</a></div></form></div>{% endblock %}
